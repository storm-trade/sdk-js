name: V3 integration contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:v3
      - run: npx eslint src/v3 tests examples/builders
      - run: npm run typecheck
